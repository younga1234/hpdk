[package]
name = "upbit-trading-bot"
version = "1.0.0"
edition = "2021"
authors = ["Your Name"]
description = "Upbit 자동매매봇"

[lib]
name = "upbit_trading_bot"
path = "src/lib.rs"

[[bin]]
name = "upbit-trading-bot"
path = "src/main.rs"

[[bin]]
name = "gui-bot"
path = "src/bin/gui_bot.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.6", features = ["v4"] }
url = "2.5"
futures = "0.3"
async-trait = "0.1"
base64 = "0.21"
jsonwebtoken = "9.2"
eframe = "0.27"
egui = "0.27"
egui_plot = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
